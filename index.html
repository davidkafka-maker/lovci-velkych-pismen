function home(){clearTimer();clearPending();state.screen="home";state.mode=null;render('<div class="card"><h1 class="title">Lovci velkých písmen</h1><p class="subtitle">Vyber správný zápis slova ve větě.<br><strong>'+DATA.length+' úloh • 15 sekund na odpověď</strong></p><div class="row"><button class="btn challengeBtn" data-act="nameChallenge">VÝZVA</button><button class="btn testBtn" data-act="nameTest">TEST</button></div><div class="row"><a class="btn ghost" href="'+RESULTS_SHEET_URL+'" target="_blank" rel="noopener noreferrer" style="text-decoration:none">VÝSLEDKOVÁ TABULKA</a></div><p class="small">TEST: 20 náhodných úloh, každá za 1 bod.<br>VÝZVA: 20 správných odpovědí v řadě = jednička. Chyba nebo vypršení času začíná novou sérii.<br>V každé otázce vyber jednu ze dvou podob slova.</p><table class="resultTable"><tr><th>Body v testu</th><th>Známka</th></tr><tr><td>20–18</td><td>1</td></tr><tr><td>17–16</td><td>2</td></tr><tr><td>15–14</td><td>3</td></tr><tr><td>13–12</td><td>4</td></tr><tr><td>11–0</td><td>5</td></tr></table></div>',null)}
function nameScreen(mode){clearPending();state.mode=mode;state.screen="name";render('<div class="card"><h1 class="title">'+(mode==="challenge"?"VÝZVA":"TEST")+'</h1><div class="nameBox"><input class="input" id="name" autocomplete="name" placeholder="Jméno žáka" aria-label="Jméno žáka"><input class="input" id="clazz" placeholder="Třída" aria-label="Třída"><button class="btn '+(mode==="challenge"?"challengeBtn":"testBtn")+'" id="start">ZAČÍT</button><button class="btn ghost" data-act="home">HLAVNÍ MENU</button></div></div>');document.getElementById("start").onclick=()=>{const n=document.getElementById("name").value.trim(),c=document.getElementById("clazz").value.trim();if(!n||!c){alert("Vyplň jméno i třídu.");return}state.name=n;state.clazz=c;start(mode)}}
function start(mode){clearTimer();clearPending();state={...state,screen:"question",mode,pool:mode==="test"?shuffle(DATA).slice(0,TEST_COUNT):shuffle(DATA),index:0,score:0,correct:0,wrongCount:0,streak:0,locked:false,restart:false,finishSent:false,seenChallenge:new Set()};next()}
function next(){clearTimer();clearPending();if(state.mode==="test"&&state.index>=TEST_COUNT)return finish();if(state.mode==="challenge"&&state.index>=state.pool.length){state.seenChallenge.clear();state.pool=shuffle(DATA);state.index=0}state.screen="question";state.current=state.pool[state.index];if(state.mode==="challenge")state.seenChallenge.add(state.current.id);state.locked=false;renderQuestion();startTimer()}
function renderQuestion(){const q=state.current;state.choices=shuffle([{text:q.answer,correct:true},{text:q.wrong,correct:false}]);const line=esc(q.before)+' <span class="blank">_____</span> '+esc(q.after);render('<div class="card"><div class="topbar"><div class="seal '+(state.mode==="challenge"?"challengeSeal":"testSeal")+'">'+(state.mode==="challenge"?"VÝZVA":"TEST")+'</div><div class="timeCenter"><span id="time">'+TIME_LIMIT+'</span><span class="status">ÚLOHA '+(state.index+1)+(state.mode==="test"?"/"+TEST_COUNT+" • BODY "+state.score:" • SÉRIE "+state.streak+"/"+CHALLENGE_TARGET)+'</span></div><div class="seal sectionSeal">VELKÁ<br>PÍSMENA</div></div><div class="prompt">Vyber správný zápis slova.</div><div class="question">'+line+'</div><div class="choiceGrid">'+state.choices.map((x,i)=>'<button class="choiceBtn" data-choice="'+i+'">'+esc(x.text)+'</button>').join("")+'</div><div class="feedback" id="fb" aria-live="polite"></div><div class="row" id="nextRow"></div><div class="small"><a href="#" data-act="home" style="color:var(--muted)">Hlavní menu</a></div></div>');document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>answer(Number(b.dataset.choice),b))}
function correctSentence(q){return esc(q.before)+' <span class="correctText">'+esc(q.answer)+'</span> '+esc(q.after)}
function markChoices(selected){document.querySelectorAll("[data-choice]").forEach((b,i)=>{b.disabled=true;if(state.choices[i].correct)b.classList.add("correct");else if(b===selected)b.classList.add("wrong")})}
function answer(i,button){if(state.locked||state.screen!=="question")return;finishAnswer(state.choices[i].correct,button,false)}
function timeout(){if(!state.locked&&state.screen==="question")finishAnswer(false,null,true)}
function finishAnswer(good,button,expired){state.locked=true;clearTimer();markChoices(button);const q=state.current,fb=document.getElementById("fb");if(good){state.correct++;state.score++;state.streak++;fb.innerHTML='<span class="ok">SPRÁVNĚ!'+(state.mode==="test"?" +1 BOD":"")+'</span>';tone(760,.09);tone(980,.1,.05,.07)}else{state.wrongCount++;state.streak=0;state.restart=state.mode==="challenge";fb.innerHTML='<span class="bad">'+(expired?"ČAS VYPRŠEL":"CHYBA")+(state.restart?" — VÝZVA ZAČÍNÁ ZNOVU":"")+'</span><br><span class="small">Správně: '+correctSentence(q)+'</span>';tone(150,.18,.15)}state.index++;if(state.mode==="challenge"&&good&&state.streak>=CHALLENGE_TARGET){state.pending=setTimeout(finishChallenge,800);return}document.getElementById("nextRow").innerHTML='<button class="btn ghost" data-act="next">'+(state.restart?"NOVÁ VÝZVA":state.mode==="test"&&state.index===TEST_COUNT?"VÝSLEDEK":"DALŠÍ")+'</button>';document.querySelector('[data-act="next"]').onclick=advance;state.pending=setTimeout(advance,good?850:4500)}
function advance(){if(!state.locked||state.screen!=="question")return;clearPending();if(state.restart){let remaining=DATA.filter(q=>!state.seenChallenge.has(q.id));if(remaining.length<CHALLENGE_TARGET){state.seenChallenge.clear();remaining=DATA}state.pool=shuffle(remaining);state.index=0;state.score=0;state.correct=0;state.wrongCount=0;state.streak=0;state.restart=false}next()}
function startTimer(){state.deadline=Date.now()+TIME_LIMIT*1000;updateTime();state.timer=setInterval(()=>{updateTime();if(Date.now()>=state.deadline){clearTimer();timeout()}},100)}
function updateTime(){const e=document.getElementById("time");if(e)e.textContent=Math.max(0,Math.ceil((state.deadline-Date.now())/1000))}
function grade(s){return s>=18?1:s>=16?2:s>=14?3:s>=12?4:5}
function finishChallenge(){clearTimer();clearPending();state.screen="finish";render('<div class="card"><h1 class="title">VÝZVA SPLNĚNA</h1><div class="result"><b>'+esc(state.name)+'</b> • '+esc(state.clazz)+'<br><b>20 správných odpovědí za sebou — známka 1</b></div><div class="sendStatus" id="sendStatus"></div><div class="row"><a class="btn ghost" href="'+RESULTS_SHEET_URL+'" target="_blank" rel="noopener noreferrer" style="text-decoration:none">VÝSLEDKOVÁ TABULKA</a><button class="btn" data-act="home">HLAVNÍ MENU</button></div></div>');sendResult(1,"VÝZVA")}
function finish(){clearTimer();clearPending();state.screen="finish";const z=grade(state.score);render('<div class="card"><h1 class="title">VÝSLEDEK TESTU</h1><div class="result"><b>'+esc(state.name)+'</b> • '+esc(state.clazz)+'<br><b>Body:</b> '+state.score+'/'+TEST_COUNT+'<br><b>Známka:</b> '+z+'</div><div class="sendStatus" id="sendStatus"></div><div class="row"><a class="btn ghost" href="'+RESULTS_SHEET_URL+'" target="_blank" rel="noopener noreferrer" style="text-decoration:none">VÝSLEDKOVÁ TABULKA</a><button class="btn" data-act="home">HLAVNÍ MENU</button></div></div>');sendResult(z,"TEST")}
function buildPayload(z,kind){return{timestamp:new Date().toISOString(),jmeno:state.name,trida:state.clazz,znamka:z,rezim:state.mode,oddil:"velká písmena",body:state.score,celkem:TEST_COUNT,spravne:state.correct,spatne:state.wrongCount,poznamka:kind,sheetId:SHEET_ID,app:"Lovci velkých písmen"}}
function sendResult(z,kind){if(state.finishSent)return;state.finishSent=true;const params=new URLSearchParams();Object.entries(buildPayload(z,kind)).forEach(([k,v])=>params.append(k,String(v??"")));fetch(GAS_WEB_APP_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:params.toString(),keepalive:true}).then(()=>{const e=document.getElementById("sendStatus");if(e)e.textContent="Výsledek byl odeslán. Zápis ověř ve výsledkové tabulce."}).catch(()=>{const e=document.getElementById("sendStatus");if(e)e.textContent="Výsledek se nepodařilo odeslat. Poznamenej si body a známku."})}
function tone(freq,dur,gain,delay){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;g.gain.value=gain||.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur);setTimeout(()=>c.close(),dur*1000+100)}catch(e){}}
const actions={home:home,nameChallenge:()=>nameScreen("challenge"),nameTest:()=>nameScreen("test"),next:advance};home();
</script>
</body>
</html>
